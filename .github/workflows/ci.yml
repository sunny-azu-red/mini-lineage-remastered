name: CI

# Pushes only on main, which publishes: a branch with a PR open would otherwise run twice.
on:
  push:
    branches: [main]
  pull_request:

# Never cancel main: mid-publish, one tag could be pushed and the other not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: suite
    # Pinned in all three jobs, so the runner changes when this does and not when a label moves.
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    services:
      # The major the game is deployed against; 5433 so a local run misses the developer's own.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: lineage_remastered_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_USERNAME: postgres
      DB_PASSWORD: pass
      DB_DATABASE: lineage_remastered_test
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elixir

      - name: Fetch dependencies
        run: mix deps.get

      # Nothing else keeps the image on the Elixir and OTP tested here, nor its runtime on the
      # builder's Alpine, whose musl and openssl the release links against.
      - name: The Dockerfile builds on what this tested
        run: |
          otp=$(grep -oP 'otp-version: "\K[^"]+' .github/actions/setup-elixir/action.yml)
          ex=$(grep -oP 'elixir-version: "\K[^"]+' .github/actions/setup-elixir/action.yml)
          grep -q "hexpm/elixir:${ex}-erlang-${otp}-" Dockerfile \
            || { echo "::error::Dockerfile pins a different Elixir/OTP than CI installs"; exit 1; }

          builder=$(grep -oP 'hexpm/elixir:.*-alpine-\K[0-9.]+' Dockerfile)
          runner=$(grep -oP '^FROM alpine:\K[0-9.]+' Dockerfile)
          [ -n "$builder" ] && [ "$builder" = "$runner" ] \
            || { echo "::error::builder is alpine ${builder:-?} but the runtime is alpine ${runner:-?}"; exit 1; }

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # --warnings-as-errors again: the step above compiles lib only.
      - name: Test
        run: mix test --warnings-as-errors

      # The balance simulations compile only in :dev, so :test alone would let them rot.
      - name: Compile the dev-only balance simulations
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors

      - name: Build a production release
        env:
          MIX_ENV: prod
        # Seven characters, the form Version.release?/1 accepts.
        run: |
          export APP_VERSION="${GITHUB_SHA::7}"
          mix do deps.get --only prod + assets.deploy + release

  browser:
    name: browser suites
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: lineage_remastered_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_USERNAME: postgres
      DB_PASSWORD: pass
      DB_DATABASE: lineage_remastered_test
      PORT: 4002
      E2E_BASE_URL: http://localhost:4002

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elixir

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Playwright and its browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The job's env stands in for .env.test.
      - name: Create the browser suites' database
        env:
          MIX_ENV: e2e
        run: mix do deps.get + ecto.create

      # `mix e2e` serves, resets and stops by itself. One step per suite names the one that failed.
      - name: Drive one character through a real browser
        run: mix e2e walkthrough

      - name: Play every lineage
        run: mix e2e races

      - name: Watch the board move for somebody else
        run: mix e2e live-board

      - name: Read a log in both orders it reads
        run: mix e2e log

  # Only from main, behind both green jobs: what is published is what was tested.
  publish:
    name: publish (ghcr)
    needs: [test, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the build after its commit
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Loaded, not pushed: a failed check below must not leave a broken `latest`.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: APP_VERSION=${{ steps.version.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A missing stamp is silent, so read it back out of the release config before pushing.
      - name: Check the image is stamped with its commit
        run: |
          docker run --rm --entrypoint sh \
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }} \
            -c 'grep -q "$1" "releases/$(cut -d" " -f2 releases/start_erl.data)/sys.config"' \
            sh '${{ steps.version.outputs.sha }}' \
            || { echo "::error::image does not report ${{ steps.version.outputs.sha }}"; exit 1; }

      - name: Push
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
