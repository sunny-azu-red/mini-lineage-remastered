name: CI

# A branch with a PR open would otherwise run everything twice — once for the push and once for the
# pull request — and the walkthrough is two minutes each time. The PR is what gates a merge, and
# main is what gets published, so those are the two that need to run.
on:
  push:
    branches: [main]
  pull_request:

# Supersede a pull request's older runs, but never interrupt main: cancelling mid-publish could
# leave one tag pushed and the other not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: suite
    runs-on: ubuntu-latest

    services:
      # MariaDB, not MySQL — it is what the game is deployed against.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pass
          MARIADB_DATABASE: lineage_remastered_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USERNAME: root
      DB_PASSWORD: pass
      DB_DATABASE: lineage_remastered_test
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-elixir

      - name: Fetch dependencies
        run: mix deps.get

      # The image is built on a pinned base rather than by this action, so nothing but a check keeps
      # the two on the same Elixir and OTP.
      - name: The Dockerfile builds on what this tested
        run: |
          otp=$(grep -oP 'otp-version: "\K[^"]+' .github/actions/setup-elixir/action.yml)
          ex=$(grep -oP 'elixir-version: "\K[^"]+' .github/actions/setup-elixir/action.yml)
          grep -q "hexpm/elixir:${ex}-erlang-${otp}-" Dockerfile \
            || { echo "::error::Dockerfile pins a different Elixir/OTP than CI installs"; exit 1; }

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # Includes the golden master, which pins this rewrite to the reference's exact arithmetic.
      # --warnings-as-errors because the step above compiles lib only; a warning in a test file
      # would otherwise reach main unnoticed.
      - name: Test
        run: mix test --warnings-as-errors

      # The balance simulations compile only in :dev, so :test alone would let them rot.
      - name: Compile the dev-only balance simulations
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors

      - name: Build a production release
        env:
          MIX_ENV: prod
        # The sha is truncated to seven characters because that is what Version.release?/1 accepts,
        # and being a release is what stops the app showing error detail to players.
        run: |
          export APP_VERSION="${GITHUB_SHA::7}"
          mix do deps.get --only prod + assets.deploy + release

  walkthrough:
    name: walkthrough (browser)
    needs: test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pass
          MARIADB_DATABASE: lineage_remastered_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USERNAME: root
      DB_PASSWORD: pass
      DB_DATABASE: lineage_remastered_test
      PORT: 4002
      E2E_BASE_URL: http://localhost:4002

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-elixir

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright and its browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # CI has no .env.test — the variables above stand in for it, as they always have for .env.
      - name: Create the browser suites' database
        env:
          MIX_ENV: e2e
        run: mix do deps.get + ecto.create

      # `mix e2e` starts the server, empties the board and stops the server again, so there is
      # nothing here to keep in step with how a developer runs it. One step per suite, so the log
      # says which one failed without anyone opening it.
      - name: Drive one character through a real browser
        run: mix e2e walkthrough

      - name: Play every lineage
        run: mix e2e races

  # Only from main, and only behind both green jobs: what is published is what was tested. The
  # image carries the commit, so a deployment names itself without anyone remembering to say so.
  publish:
    name: publish (ghcr)
    needs: [test, walkthrough]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the build after its commit
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Loaded, not pushed. Publishing first would leave a broken image tagged `latest` whenever the
      # check below failed, and `latest` is what a deployment pulls.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: APP_VERSION=${{ steps.version.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }}
          # Layers survive between runs, so only what actually changed is rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every way the stamp can fail to reach `mix release` is silent — a footer that names no
      # commit. Read it back out of the release config before this image is allowed out.
      - name: Check the image is stamped with its commit
        run: |
          docker run --rm --entrypoint sh \
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }} \
            -c 'grep -q "$1" "releases/$(cut -d" " -f2 releases/start_erl.data)/sys.config"' \
            sh '${{ steps.version.outputs.sha }}' \
            || { echo "::error::image does not report ${{ steps.version.outputs.sha }}"; exit 1; }

      - name: Push
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
