name: CI

# A branch with a PR open would otherwise run everything twice — once for the push and once for the
# pull request — and the walkthrough is two minutes each time. The PR is what gates a merge, and
# main is what gets published, so those are the two that need to run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: suite
    runs-on: ubuntu-latest

    services:
      # MariaDB, not MySQL — it is what the game is deployed against.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pass
          MARIADB_DATABASE: lineage_remastered_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USERNAME: root
      DB_PASSWORD: pass
      DB_DATABASE: lineage_remastered_test
      DB_DATABASE_TEST: lineage_remastered_test
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v6

      # Pinned to the versions the game is developed against, and to the ones the Dockerfile builds.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.19.6"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # Includes the golden master, which pins this rewrite to the reference's exact arithmetic.
      - name: Test
        run: mix test

      # The balance simulations compile only in :dev, so :test alone would let them rot.
      - name: Compile the dev-only balance simulations
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors

      - name: Build a production release
        env:
          MIX_ENV: prod
        # The sha is truncated to seven characters because that is what Version.release?/1 accepts,
        # and being a release is what stops the app showing error detail to players.
        run: |
          export APP_VERSION="${GITHUB_SHA::7}"
          mix do deps.get --only prod + assets.deploy + release

  walkthrough:
    name: walkthrough (browser)
    needs: test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pass
          MARIADB_DATABASE: lineage_remastered_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USERNAME: root
      DB_PASSWORD: pass
      DB_DATABASE_TEST: lineage_remastered_test
      PORT_E2E: 4002
      E2E_BASE_URL: http://localhost:4002

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.6"
          elixir-version: "1.19.6"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Playwright and its browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create the walkthrough's database
        env:
          MIX_ENV: e2e
          DB_DATABASE: lineage_remastered_test
        run: mix do deps.get + ecto.create

      # serve.sh migrates, then serves on PORT_E2E against DB_DATABASE_TEST.
      - name: Serve the game
        run: |
          e2e/serve.sh &
          timeout 120 bash -c 'until curl -sf "$E2E_BASE_URL" >/dev/null; do sleep 1; done'

      - name: Drive it in a real browser
        run: npm run test:e2e

  # Only from main, and only behind both green jobs: what is published is what was tested. The
  # image carries the commit, so a deployment names itself without anyone remembering to say so.
  publish:
    name: publish (ghcr)
    needs: [test, walkthrough]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the build after its commit
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.sha }}
          # Layers survive between runs, so only what actually changed is rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max
