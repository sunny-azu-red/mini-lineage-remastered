name: Set up Elixir
description: The toolchain the game is developed against, and the cache of what it builds.

runs:
  using: composite
  steps:
    # Pinned here alone; the Dockerfile is checked against these.
    - uses: erlef/setup-beam@v1
      with:
        otp-version: "29.1.1"
        elixir-version: "1.20.4"

    - uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
