# Builds here instead of pulling the published image, and lives apart from docker-compose.yml so
# that a deployment cannot reach it:
#
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
services:
  mini-lineage:
    build:
      context: .
      args:
        # Only cosmetic: APP_VERSION=$(git rev-parse --short=7 HEAD) puts a commit in the footer.
        APP_VERSION: ${APP_VERSION:-}
