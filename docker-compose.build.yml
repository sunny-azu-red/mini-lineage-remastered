# Builds the image here instead of pulling the published one:
#
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Kept out of docker-compose.yml so a deployment cannot accidentally build: Portainer prefers a
# build section when it finds one, and then serves a tree nothing tested.
services:
  mini-lineage:
    build:
      context: .
      args:
        # Optional, and only cosmetic — it puts a commit link in the footer:
        #     APP_VERSION=$(git rev-parse --short=7 HEAD) docker compose ... up --build
        APP_VERSION: ${APP_VERSION:-}
