services:
  mini-lineage:
    # Deploying pulls this — the image CI built from the commit that passed, already named after it.
    # IMAGE_TAG pins an older one; the default follows main.
    image: ghcr.io/sunny-azu-red/mini-lineage-remastered:${IMAGE_TAG:-latest}
    # Only for building locally, with `docker compose build`. A deployment never reaches it.
    # APP_VERSION is what puts a commit link in the footer; a local build usually has none, and the
    # footer then reads `production`.
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
    container_name: mini-lineage
    restart: always
    # The release runs as PID 1 and does not reap the children the ERTS spawns.
    init: true
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      - PHX_HOST=${PHX_HOST:-localhost}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    # restart: always covers a crash; this covers a process that is up but no longer answering.
    # localhost is excluded from force_ssl, so this reaches the game rather than a redirect.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-4000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
