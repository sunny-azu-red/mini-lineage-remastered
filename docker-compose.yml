services:
  # The TypeScript reference. Removed at cutover, once the Elixir service has replaced it.
  mini-lineage-remastered:
    build: .
    container_name: mini-lineage-remastered
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      - SESSION_SECRET=${SESSION_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  # The Phoenix rewrite. Migrates on start, so a fresh database is never served against.
  mini-lineage-elixir:
    build: ./game
    container_name: mini-lineage-elixir
    restart: always
    ports:
      - "${ELIXIR_PORT:-4000}:${ELIXIR_PORT:-4000}"
    environment:
      - PORT=${ELIXIR_PORT:-4000}
      - PHX_HOST=${PHX_HOST:-localhost}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
