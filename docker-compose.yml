services:
  mini-lineage:
    # What CI built and tested. No `build:` on purpose — given one, Portainer builds the working
    # tree instead of pulling, and deploys something nothing ran against.
    image: ghcr.io/sunny-azu-red/mini-lineage-remastered:${IMAGE_TAG:-latest}
    container_name: mini-lineage
    restart: always
    # The release runs as PID 1 and does not reap the children the ERTS spawns.
    init: true
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      # Every key is required or defaulted, never bare: compose passes a missing one through as an
      # EMPTY value, which is not an absent one. 127.0.0.1 here would be the container itself.
      - PHX_HOST=${PHX_HOST:?set PHX_HOST to the host players reach}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?generate one with mix phx.gen.secret}
      - DB_HOST=${DB_HOST:?set DB_HOST to where Postgres is reachable from the container}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:?set DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Optional, and defaulted to what prod.exs already sets, so leaving them unset changes nothing.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT=${RATE_LIMIT:-true}
    # restart: always covers a crash; this covers a process that is up but no longer answering.
    # localhost is excluded from force_ssl, so this reaches the endpoint rather than a redirect.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-4000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
