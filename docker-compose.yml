services:
  mini-lineage:
    # What CI built and tested. No `build:` on purpose — given one, Portainer builds the working
    # tree instead of pulling, and deploys something nothing ran against.
    image: ghcr.io/sunny-azu-red/mini-lineage-remastered:${IMAGE_TAG:-latest}
    container_name: mini-lineage
    restart: always
    # The release runs as PID 1 and does not reap the children the ERTS spawns.
    init: true
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      - PHX_HOST=${PHX_HOST:-localhost}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    # restart: always covers a crash; this covers a process that is up but no longer answering.
    # localhost is excluded from force_ssl, so this reaches the game rather than a redirect.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-4000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
